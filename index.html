<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convene | Event Management Platform</title>
  <meta name="description" content="Discover, host, and manage events, workshops, and community gatherings with Convene.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Navigation Header -->
  <header class="navbar">
    <div class="nav-container">
      <a href="#dashboard" class="logo">
        <span class="logo-icon">🎪</span>
        <span class="logo-text">Convene</span>
      </a>
      <nav class="nav-links">
        <a href="#dashboard" class="nav-link active" id="nav-dashboard">Dashboard</a>
        <a href="#events" class="nav-link" id="nav-events">Events</a>
        <a href="#create" class="nav-link btn-nav" id="nav-create">+ New Event</a>
      </nav>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="app-content" class="main-container">
    <!-- Dynamic view content injected here -->
  </main>

  <!-- Simple Footer -->
  <footer class="footer">
    <div class="footer-container">
      <p>© 2026 Convene Event Platform — Simple Event Management</p>
    </div>
  </footer>

  <!-- Confirmation Modal -->
  <div id="confirm-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-icon">⚠️</div>
      <h3 id="modal-title" class="modal-title">Are you sure?</h3>
      <p id="modal-message" class="modal-message">This action cannot be undone.</p>
      <div class="modal-actions">
        <button id="modal-cancel-btn" class="btn btn-secondary">Cancel</button>
        <button id="modal-confirm-btn" class="btn btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast Container (injected by JS) -->

  <!-- Scripts -->
  <script src="js/store.js"></script>
  <script src="js/router.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/events.js"></script>
  <script src="js/views/eventDetail.js"></script>
  <script src="js/views/createEvent.js"></script>
  <script src="js/views/savedEvents.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
